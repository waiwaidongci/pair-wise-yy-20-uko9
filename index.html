<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>传统戏曲锣鼓经排练可视化</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p>Luogujing Rehearsal Grid</p>
        <h1>传统戏曲锣鼓经排练可视化</h1>
      </div>
      <div class="transport">
        <button id="playBtn" type="button">播放</button>
        <button id="stopBtn" type="button">停止</button>
        <button id="saveBtn" type="button">保存方案</button>
      </div>
    </header>

    <section class="controls">
      <label>剧目片段<input id="pieceName" placeholder="如：出场锣鼓-慢起"></label>
      <label>速度BPM<input id="bpmInput" type="number" min="40" max="220" value="96"></label>
      <label>循环小节
        <select id="loopSelect">
          <option value="">全段</option>
          <option value="0">第1小节</option>
          <option value="1">第2小节</option>
          <option value="2">第3小节</option>
          <option value="3">第4小节</option>
        </select>
      </label>
      <label>难点批注<input id="noteInput" placeholder="如：第2小节小锣晚半拍"></label>
    </section>

    <section class="stage">
      <aside class="segments">
        <h2>已存方案</h2>
        <p class="panel-hint">每次保存生成一个版本；展开方案可查看、载入或清理历史版本。</p>
        <div id="lockTip" class="lock-tip" hidden>播放中，历史版本暂不可切换，停止后恢复。</div>
        <div id="savedList"></div>
      </aside>
      <section class="score">
        <div id="grid" class="grid"></div>
      </section>
      <aside class="notes">
        <h2>段落结构</h2>
        <div id="structure"></div>
        <h2>批注</h2>
        <div id="notesList"></div>
      </aside>
    </section>
  </main>

  <div id="dialog" class="dialog" hidden>
    <form class="dialog-card" id="dialogForm">
      <h3 id="dialogTitle">保存版本</h3>
      <label for="dialogInput">本次调整小结
        <textarea id="dialogInput" rows="3" required placeholder="如：第2小节小锣晚半拍"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" id="dialogCancel" class="btn-ghost">取消</button>
        <button type="submit" id="dialogConfirm">保存版本</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
